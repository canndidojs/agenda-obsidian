<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Anotar</title>
<style>
:root{
  color-scheme:dark light;
  --bg:#1e1e1e; --surface:#262626; --line:#363636; --tx:#dadada; --mut:#9b9b9b;
  --ac:#7c5ce6; --ac-tx:#fff; --ac-fg:#a591f5; --ring:#a591f5;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px;
  --r:4px; --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme:light){
  :root{--bg:#ffffff; --surface:#f6f6f6; --line:#e3e3e3; --tx:#222222; --mut:#6e6e6e; --ac:#6c4fd6; --ac-fg:#6c4fd6; --ring:#6c4fd6}
}
*{box-sizing:border-box;scrollbar-width:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
::selection{background:var(--ac);color:var(--ac-tx)}
form{border:1px solid var(--ac-fg);background:var(--surface)}
.row{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s1) var(--s1) var(--s4)}
#texto{flex:1;min-width:0;height:48px;padding:0;background:none;border:0;font-size:18px}
#texto:focus{outline:none}
#texto::placeholder{color:var(--mut)}
.pend{position:relative;flex:none;cursor:pointer}
.pend input{position:absolute;opacity:0;pointer-events:none}
.pend span{display:inline-flex;align-items:center;gap:var(--s2);height:36px;padding:0 var(--s2);font-size:13px;color:var(--mut);transition:color .12s}
.pend span::before{content:"";width:14px;height:14px;border:1.5px solid currentColor;border-radius:2px}
.pend:hover span,.pend input:checked + span{color:var(--tx)}
.pend input:checked + span::before{background:var(--ac);border-color:var(--ac)}
.pend input:focus-visible + span{outline:2px solid var(--ring);outline-offset:2px}
.hint{margin:0;padding:var(--s2) var(--s4);border-top:1px solid var(--line);color:var(--mut);font:12px/1.4 var(--mono)}
kbd{font:inherit;color:var(--tx)}
#sug{list-style:none;margin:0;padding:var(--s1);border-top:1px solid var(--line)}
#sug[hidden]{display:none}
#sug li{padding:var(--s1) var(--s3);border-radius:2px;cursor:pointer;font:600 13px var(--mono)}
#sug li[aria-selected=true]{background:var(--ac);color:var(--ac-tx)}
.done{margin:0;padding:var(--s4);font-weight:600;color:var(--ac-fg)}
.done[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="row" id="row">
    <input id="texto" name="texto" type="text" aria-label="Texto da anotação" placeholder="Anotar agora…" spellcheck="true"
      role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sug">
    <label class="pend" title="A anotação volta nos dias seguintes até você concluir (Alt+P)"><input type="checkbox" id="pend"><span>Pendente</span></label>
    <label class="pend" title="A anotação fica no topo de todos os dias até você apagar (Alt+F)"><input type="checkbox" id="fixa"><span>Fixa</span></label>
  </div>
  <ul id="sug" role="listbox" aria-label="Tags sugeridas" hidden></ul>
  <p class="hint" id="hint"><kbd>Enter</kbd> anota · <kbd>Alt</kbd>+<kbd>P</kbd> pendente · <kbd>Alt</kbd>+<kbd>F</kbd> fixa · <kbd>Esc</kbd> fecha</p>
  <p class="done" id="done" role="status" hidden>Anotado.</p>
</form>
<script src="/shared.js"></script>
<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const hoje=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
let tags=[],sugItems=[],sugIdx=0,saving=false;
const loadTags=()=>fetch('/api/tags').then(r=>r.json()).then(t=>{tags=t}).catch(()=>{});

// A janela do Electron acompanha a altura do formulário (cresce com a lista de sugestões)
const fit=()=>window.agendaQuick&&window.agendaQuick.resize(Math.ceil($('f').getBoundingClientRect().height));
new ResizeObserver(fit).observe($('f'));

function hideSug(){const s=$('sug');s.hidden=true;s.textContent='';sugItems=[];$('texto').setAttribute('aria-expanded','false');$('texto').removeAttribute('aria-activedescendant')}
function paintSug(){
  const s=$('sug');s.textContent='';
  sugItems.forEach((t,i)=>{
    const li=document.createElement('li');li.id='sug-'+i;li.setAttribute('role','option');li.setAttribute('aria-selected',i===sugIdx);li.textContent=t;
    li.addEventListener('mousedown',e=>{e.preventDefault();acceptSug(i)});
    s.append(li);
  });
  $('texto').setAttribute('aria-activedescendant','sug-'+sugIdx);
}
function showSug(){
  const tk=tokenDe($('texto'));
  if(!tk){hideSug();return}
  sugItems=sugerirTags(tags.map(t=>t.tag),tk.q);
  if(!sugItems.length){hideSug();return}
  sugIdx=0;$('sug').hidden=false;$('texto').setAttribute('aria-expanded','true');paintSug();
}
function acceptSug(i){
  const inp=$('texto'),tk=tokenDe(inp);if(!tk)return;
  const after=inp.value.slice(inp.selectionStart),ins=sugItems[i]+' ';
  inp.value=inp.value.slice(0,tk.start)+ins+after.replace(/^ /,'');
  const pos=tk.start+ins.length;inp.setSelectionRange(pos,pos);hideSug();inp.focus();
}
$('texto').addEventListener('input',showSug);
$('texto').addEventListener('click',showSug);
$('texto').addEventListener('keydown',e=>{
  if(!$('sug').hidden){
    if(e.key==='ArrowDown'){e.preventDefault();sugIdx=(sugIdx+1)%sugItems.length;paintSug();return}
    if(e.key==='ArrowUp'){e.preventDefault();sugIdx=(sugIdx-1+sugItems.length)%sugItems.length;paintSug();return}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();acceptSug(sugIdx);return}
    if(e.key==='Escape'){e.preventDefault();hideSug();return}
  }
});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('sug').hidden){window.agendaQuick&&window.agendaQuick.close()}
  if(e.altKey&&e.key.toLowerCase()==='p'){e.preventDefault();$('pend').checked=!$('pend').checked;if($('pend').checked)$('fixa').checked=false}
  if(e.altKey&&e.key.toLowerCase()==='f'){e.preventDefault();$('fixa').checked=!$('fixa').checked;if($('fixa').checked)$('pend').checked=false}
});

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const t=$('texto').value.trim();if(!t||saving)return;
  saving=true;
  try{
    const r=$('fixa').checked
      ?await fetch('/api/fixas/add',{method:'POST',body:JSON.stringify({texto:t})})
      :await fetch('/api/add',{method:'POST',body:JSON.stringify({date:hoje(),texto:t,pendente:$('pend').checked})});
    if(!r.ok)throw new Error();
  }catch{saving=false;$('hint').textContent='Não consegui salvar. Reabra o app.';return}
  hideSug();$('row').hidden=true;$('hint').hidden=true;$('done').hidden=false;
  setTimeout(()=>{window.agendaQuick&&window.agendaQuick.saved()},450);
});

// Cada vez que a janela é aberta: limpa, foca e atualiza as tags
function reset(){
  saving=false;$('texto').value='';$('pend').checked=false;$('fixa').checked=false;
  $('row').hidden=false;$('hint').hidden=false;$('done').hidden=true;
  $('hint').innerHTML='<kbd>Enter</kbd> anota · <kbd>Alt</kbd>+<kbd>P</kbd> pendente · <kbd>Alt</kbd>+<kbd>F</kbd> fixa · <kbd>Esc</kbd> fecha';
  hideSug();loadTags();$('texto').focus();
}
window.addEventListener('quick-show',reset);
loadTags();$('texto').focus();
</script>
</body>
</html>
