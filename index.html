<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#14131a">
<title>Agenda</title>
<style>
:root{
  color-scheme:dark light;
  --bg:#14131a; --surface:#1d1c26; --surface-2:#262532; --line:#33323f;
  --tx:#f1effa; --mut:#9d9ab3; --ac:#8b6cff; --ac-tx:#fff; --ring:#b6a3ff;
  --c-tarefa:#8b6cff; --c-nota:#5bc0eb; --c-admin:#ffb547; --c-dev:#4ade80; --c-ideia:#f472b6;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f6f4fb; --surface:#fff; --surface-2:#efecf8; --line:#ddd8ee;
    --tx:#1c1830; --mut:#6a6585; --ac:#5b3fe0; --ring:#5b3fe0;
    --c-tarefa:#5b3fe0; --c-nota:#0a84b8; --c-admin:#c47a00; --c-dev:#15803d; --c-ideia:#c026a3;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.skip{position:absolute;left:12px;top:-60px;background:var(--ac);color:var(--ac-tx);padding:8px 12px;border-radius:8px;z-index:10}
.skip:focus{top:12px}
main{max-width:640px;margin:0 auto;padding:20px 20px 40px}

/* Cabeçalho do dia */
.top{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.top .sp{flex:1}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;transition:background-color .15s,border-color .15s}
.icon-btn:hover{background:var(--surface-2);border-color:var(--ac)}
.icon-btn:active{transform:scale(.96)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.today-btn{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;
  font-weight:600;transition:background-color .15s,border-color .15s}
.today-btn:hover{background:var(--surface-2);border-color:var(--ac)}

.hero{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}
.big{font-size:72px;line-height:.9;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--ac)}
.hero h1{margin:0;font-size:22px;line-height:1.2;font-weight:650;text-transform:capitalize;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--mut);font-size:14px}
.chip{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:99px;background:var(--surface-2);font-size:12px;color:var(--mut)}

/* Captura */
.capture{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:22px;
  transition:border-color .15s,box-shadow .15s}
.capture:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.types{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;padding:0;border:0}
.types legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.types label{cursor:pointer}
.types input{position:absolute;opacity:0;pointer-events:none}
.types span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);
  font-size:13px;font-weight:550;color:var(--mut);transition:background-color .15s,color .15s,border-color .15s}
.types span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot)}
.types label:hover span{color:var(--tx)}
.types input:checked + span{background:color-mix(in srgb,var(--dot) 18%,transparent);border-color:var(--dot);color:var(--tx)}
.types input:focus-visible + span{outline:2px solid var(--ring);outline-offset:2px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;height:44px;padding:0 4px;background:transparent;border:0;font-size:16px}
.row input:focus{outline:none}
.row input::placeholder{color:var(--mut)}
.save{height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--ac);color:var(--ac-tx);font-weight:650;cursor:pointer;
  transition:filter .15s,transform .1s}
.save:hover{filter:brightness(1.12)}
.save:active{transform:scale(.97)}
.hint{margin:8px 4px 0;color:var(--mut);font-size:12px}
kbd{font:inherit;padding:0 5px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2)}

/* Seções */
.sec{margin-bottom:20px}
.sec h2{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:12px;font-weight:650;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mut)}
.sec h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot)}
.sec h2 .n{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:0}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:baseline;gap:10px;padding:8px 12px;border-radius:10px;overflow-wrap:anywhere}
li:hover{background:var(--surface)}
.time{flex:none;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.empty{color:var(--mut);font-size:14px;padding:6px 12px}
li label{display:flex;align-items:baseline;gap:10px;cursor:pointer;width:100%}
li input[type=checkbox]{flex:none;width:18px;height:18px;margin:0;align-self:center;accent-color:var(--ac);cursor:pointer}
.done{color:var(--mut);text-decoration:line-through}
.bar{height:4px;border-radius:4px;background:var(--surface-2);margin:2px 12px 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-tarefa);transform-origin:left;transition:transform .25s}

footer{display:flex;align-items:center;gap:10px;margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}
footer .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer a{color:var(--ac);font-weight:600;text-decoration:none;white-space:nowrap}
footer a:hover{text-decoration:underline}
#status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#texto">Ir para o campo de anotação</a>
<main>
  <nav class="top" aria-label="Navegar entre dias">
    <button class="icon-btn" id="prev" type="button" aria-label="Dia anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="icon-btn" id="next" type="button" aria-label="Próximo dia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    <span class="sp"></span>
    <button class="today-btn" id="hoje" type="button">Hoje</button>
  </nav>

  <header class="hero">
    <div class="big" id="dia" aria-hidden="true"></div>
    <div>
      <h1 id="titulo"></h1>
      <p><span id="mes"></span><span class="chip" id="semana"></span></p>
    </div>
  </header>

  <form class="capture" id="f" autocomplete="off">
    <div class="row">
      <input id="texto" name="texto" type="text" aria-label="Texto da anotação" placeholder="O que apareceu agora…" spellcheck="true">
      <button class="save" type="submit">Anotar</button>
    </div>
    <p class="hint"><kbd>Enter</kbd> salva · <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>N</kbd> abre de qualquer lugar</p>
  </form>

  <div id="lista"></div>

  <footer>
    <span class="path" id="path"></span>
    <a id="obs" href="#" target="_blank" rel="noreferrer" hidden>Abrir no Obsidian</a>
  </footer>
  <div id="status" role="status" aria-live="polite"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const SECOES=[['Anotações','--c-nota']];
const VAZIO={Anotações:'Nada anotado neste dia ainda. Escreva acima e aperte Enter.'};
let cur=new Date();
const post=(u,b)=>fetch(u,{method:'POST',body:JSON.stringify(b)});
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);
  return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7)};

async function load(){
  const ds=fmt(cur);
  const dtf=(o)=>new Intl.DateTimeFormat('pt-BR',o).format(cur);
  $('dia').textContent=cur.getDate();
  $('titulo').textContent=dtf({weekday:'long'});
  $('mes').textContent=dtf({month:'long',year:'numeric'});
  $('semana').textContent='Semana '+isoWeek(cur);
  document.title=`Agenda · ${dtf({day:'numeric',month:'short'})}`;
  let r;
  try{ r=await (await fetch('/api/day?date='+ds)).json(); }catch{ $('status').textContent='Não consegui ler o dia. Reabra o app.'; return; }
  $('path').textContent=r.rel||'Este dia ainda não tem arquivo. Ele nasce na primeira anotação.';
  const obs=$('obs');
  if(r.rel){obs.hidden=false;obs.href=`obsidian://open?vault=${encodeURIComponent(r.vault)}&file=${encodeURIComponent(r.rel.replace(/\.md$/,''))}`}else obs.hidden=true;

  const lista=$('lista');lista.textContent='';
  SECOES.forEach(([nome,cor])=>{
    const items=Object.values(r.sections).flat();
    const sec=document.createElement('section');sec.className='sec';sec.style.setProperty('--dot',`var(${cor})`);
    const h=document.createElement('h2');h.textContent=nome;
    if(nome==='Tarefas'&&items.length){
      const feitas=items.filter(i=>/^- \[x\]/.test(i.text)).length;
      const n=document.createElement('span');n.className='n';n.textContent=`${feitas} de ${items.length}`;h.append(n);
      sec.append(h);
      const bar=document.createElement('div');bar.className='bar';const i=document.createElement('i');
      i.style.transform=`scaleX(${feitas/items.length})`;bar.append(i);sec.append(bar);
    }else sec.append(h);
    if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent=VAZIO[nome];sec.append(p)}
    else{
      const ul=document.createElement('ul');
      items.forEach(it=>{
        const li=document.createElement('li');const t=it.text.replace(/^- /,'');
        const task=t.match(/^\[( |x)\] (.*)/);
        if(task){
          const lb=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=task[1]==='x';
          cb.setAttribute('aria-label',task[2]);
          cb.onchange=async()=>{await post('/api/toggle',{date:ds,idx:it.idx});$('status').textContent=cb.checked?'Tarefa concluída':'Tarefa reaberta';load()};
          const sp=document.createElement('span');sp.textContent=task[2];if(cb.checked)sp.className='done';
          lb.append(cb,sp);li.append(lb);
        }else{
          const m=t.match(/^(\d{2}:\d{2}) (.*)/);
          if(m){const tm=document.createElement('span');tm.className='time';tm.textContent=m[1];li.append(tm);
            const sp=document.createElement('span');sp.textContent=m[2];li.append(sp)}
          else li.textContent=t;
        }
        ul.append(li);
      });
      sec.append(ul);
    }
    lista.append(sec);
  });
}

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const t=$('texto').value.trim();if(!t)return;
  await post('/api/add',{date:fmt(cur),texto:t});
  $('texto').value='';$('status').textContent='Anotação salva';
  await load();$('texto').focus();
});
$('prev').onclick=()=>{cur.setDate(cur.getDate()-1);load()};
$('next').onclick=()=>{cur.setDate(cur.getDate()+1);load()};
$('hoje').onclick=()=>{cur=new Date();load();$('texto').focus()};
window.addEventListener('focus-capture',()=>{ if(fmt(cur)!==fmt(new Date())){cur=new Date();load()} $('texto').focus() });
window.addEventListener('focus',()=>{ load() });
load();
</script>
</body>
</html>
