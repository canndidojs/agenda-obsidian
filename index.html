<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1e1e1e">
<title>Anotaí</title>
<style>
:root{
  color-scheme:dark light;
  /* cores (neutros e roxo no estilo do Obsidian) */
  --bg:#1e1e1e; --surface:#262626; --line:#363636; --tx:#dadada; --mut:#9b9b9b;
  --ac:#7c5ce6; --ac-tx:#fff; --ac-fg:#a591f5; --ring:#a591f5; --warn:#d9a441; --tag-l:72%;
  /* espaçamento: escala de 4 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  /* tipografia */
  --t-meta:12px; --t-label:13px; --t-body:15px; --t-title:22px; --t-day:64px;
  --r:4px;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#ffffff; --surface:#f6f6f6; --line:#e3e3e3; --tx:#222222; --mut:#6e6e6e;
    --ac:#6c4fd6; --ac-tx:#fff; --ac-fg:#6c4fd6; --ring:#6c4fd6; --warn:#a86a00; --tag-l:36%;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--t-body)/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
::selection{background:var(--ac);color:var(--ac-tx)}
html{scrollbar-width:none}
::-webkit-scrollbar{display:none}
.skip{position:absolute;left:var(--s3);top:-60px;background:var(--ac);color:var(--ac-tx);padding:var(--s2) var(--s3);border-radius:var(--r);z-index:10}
.skip:focus{top:var(--s3)}
html,body{height:100%;overflow:hidden}
*{scrollbar-width:none}
/* A janela nunca rola: o cabeçalho, a captura e o rodapé ficam fixos e só a lista de anotações rola por dentro */
main{display:flex;flex-direction:column;height:100%;max-width:680px;margin:0 auto;padding:0 calc(var(--s6) + var(--s2))}
/* Grade comum: coluna do dia/hora (80px) + coluna do texto. O título, as horas e o texto das anotações usam as mesmas colunas. */
:root{--gutter:88px}

/* 1. Navegação (apoio, discreta) */
.top{flex:none;display:flex;align-items:center;gap:var(--s1);margin-bottom:var(--s5);padding:var(--s5) 0 0}
#prev{margin-left:calc((36px - 18px) / -2)}
.icon-btn{display:grid;place-items:center;flex:none;width:36px;height:36px;border:0;border-radius:var(--r);background:none;color:var(--mut);cursor:pointer;
  transition:background-color .12s,color .12s}
.icon-btn:hover{background:var(--surface);color:var(--tx)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square}
.today-btn{flex:none;height:36px;padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r);background:none;cursor:pointer;
  font-size:var(--t-label);font-weight:600;transition:border-color .12s,opacity .12s}
.today-btn:hover:not(:disabled){border-color:var(--mut)}
.today-btn:disabled{opacity:.4;cursor:default}
.search{flex:1;min-width:0;height:36px;margin:0 var(--s2);padding:0 var(--s1);border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;
  font-size:var(--t-label);transition:border-color .12s}
.search:focus{outline:none;border-bottom-color:var(--ac-fg)}
.search::placeholder{color:var(--mut)}
.search::-webkit-search-cancel-button{display:none}

/* 2. Dia (nível mais alto da hierarquia) */
.hero{flex:none;display:grid;grid-template-columns:var(--gutter) minmax(0,1fr);align-items:last baseline;margin-bottom:var(--s5)}
.big{font-size:var(--t-day);line-height:.85;font-weight:300;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big.today{color:var(--ac-fg)}
.hero h1{margin:0;font-size:var(--t-title);line-height:1.2;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.hero h1::first-letter{text-transform:uppercase}
.hero p{margin:var(--s1) 0 0;color:var(--mut);font-size:var(--t-label)}
.chip::before{content:"·";margin:0 var(--s2)}

/* 3. Captura (ação principal) */
.capture{position:relative;flex:none;margin-bottom:var(--s5);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color .12s}
.capture:focus-within{border-color:var(--ac-fg)}
.row{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s1) var(--s1) var(--s4)}
.row #texto{flex:1;min-width:0;height:44px;padding:0;background:none;border:0;font-size:17px}
.row #texto:focus{outline:none}
.row #texto::placeholder{color:var(--mut)}
.pend{position:relative;flex:none;cursor:pointer}
.pend input{position:absolute;opacity:0;pointer-events:none}
.pend span{display:inline-flex;align-items:center;gap:var(--s2);height:36px;padding:0 var(--s2);font-size:var(--t-label);color:var(--mut);transition:color .12s}
.pend span::before{content:"";width:14px;height:14px;border:1.5px solid currentColor;border-radius:2px}
.pend:hover span,.pend input:checked + span{color:var(--tx)}
.pend input:checked + span::before{background:var(--ac);border-color:var(--ac)}
.pend input:focus-visible + span{outline:2px solid var(--ring);outline-offset:2px}
.save{flex:none;height:40px;padding:0 var(--s4);border:0;border-radius:var(--r);background:var(--ac);color:var(--ac-tx);font-size:14px;font-weight:700;cursor:pointer;
  transition:filter .12s}
.save:hover{filter:brightness(1.12)}
.hint{margin:0;padding:var(--s2) var(--s4);border-top:1px solid var(--line);color:var(--mut);font:var(--t-meta)/1.4 var(--mono)}
kbd{font:inherit;color:var(--tx)}

/* 4. Anotações (conteúdo; é a única área que rola) */
#lista{flex:1;min-height:0;overflow-y:auto;margin:0 calc(var(--s3) * -1);padding:0 var(--s3) var(--s5);
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - var(--s5)),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - var(--s5)),transparent)}
.sec{margin-bottom:var(--s5)}
.sec h2{display:flex;align-items:baseline;gap:var(--s2);margin:0 0 var(--s1);padding-bottom:var(--s2);border-bottom:1px solid var(--line);
  font-size:var(--t-meta);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.sec h2 .n{margin-left:auto;font:var(--t-meta) var(--mono);letter-spacing:0;text-transform:none}
.sec.late h2{color:var(--warn)}
ul{list-style:none;margin:0;padding:0}
/* cada linha: [hora/data 60px][caixinha 28px][texto][ações]; o texto começa sempre na coluna de 88px */
li{display:grid;grid-template-columns:calc(var(--gutter) - 28px) 28px minmax(0,1fr) auto;align-items:baseline;padding:var(--s2) var(--s3);margin:0 calc(var(--s3) * -1);border-radius:var(--r);overflow-wrap:anywhere}
li:hover{background:var(--surface)}
li label{display:contents}
.time,.go{grid-column:1;grid-row:1}
.txt,.edit{grid-column:3;grid-row:1}
.acts{grid-column:4;grid-row:1}
li input[type=checkbox]{grid-column:2;grid-row:1;align-self:start;width:16px;height:16px;margin:4px 0 0;accent-color:var(--ac);cursor:pointer}
li:has(input[type=checkbox]) .txt{cursor:pointer}
.time{color:var(--mut);font:var(--t-meta) var(--mono)}
.empty{margin:0;padding:var(--s4) 0;color:var(--mut);font-size:14px}
.done{color:var(--mut);text-decoration:line-through}
.tag{display:inline;padding:0;margin:0;border:0;border-radius:0;background:none;cursor:pointer;font:inherit;font-weight:600;
  color:hsl(var(--h) 70% var(--tag-l))}
.tag:hover{text-decoration:underline;text-underline-offset:3px}
.go{padding:0;border:0;background:none;color:var(--ac-fg);font:var(--t-meta) var(--mono);cursor:pointer;text-align:left}
.go:hover{text-decoration:underline;text-underline-offset:3px}
.res-h{margin:0 0 var(--s3);color:var(--mut);font-size:var(--t-label)}

#sug{position:absolute;left:-1px;top:calc(100% + var(--s1));z-index:5;min-width:200px;max-width:320px;padding:var(--s1);background:var(--surface);
  border:1px solid var(--ac-fg);border-radius:var(--r)}
#sug[hidden]{display:none}
#sug li{display:block;margin:0;padding:var(--s1) var(--s3);border-radius:2px;cursor:pointer;font:600 var(--t-label) var(--mono)}
#sug li[aria-selected=true]{background:var(--ac);color:var(--ac-tx)}

.acts{display:flex;align-self:center;opacity:0;transition:opacity .12s}
li:hover .acts,li:focus-within .acts{opacity:1}
.acts button{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:var(--r);background:none;color:var(--mut);cursor:pointer}
.acts button:hover{background:var(--line);color:var(--tx)}
.acts button.del:hover{color:#ff6b6b}
.acts svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter}
.edit{width:100%;min-width:0;height:32px;padding:0 var(--s2);border:1px solid var(--ac-fg);border-radius:var(--r);background:var(--bg);font-size:var(--t-body)}
.edit:focus{outline:none}
#toast{position:fixed;left:50%;bottom:var(--s5);transform:translateX(-50%);display:flex;align-items:center;gap:var(--s4);padding:var(--s2) var(--s2) var(--s2) var(--s4);
  border-radius:var(--r);background:var(--tx);color:var(--bg);font-size:var(--t-label)}
#toast[hidden]{display:none}
#toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:var(--s1) var(--s2)}

/* 5. Rodapé (informação de apoio) */
footer{flex:none;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0 var(--s4);border-top:1px solid var(--line);color:var(--mut);font:var(--t-meta) var(--mono)}
footer .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer a{color:var(--ac-fg);text-decoration:none;white-space:nowrap}
footer a:hover{text-decoration:underline;text-underline-offset:3px}
#status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#texto">Ir para o campo de anotação</a>
<main>
  <nav class="top" aria-label="Navegação">
    <button class="icon-btn" id="prev" type="button" aria-label="Dia anterior" title="Dia anterior (Alt+←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="icon-btn" id="next" type="button" aria-label="Próximo dia" title="Próximo dia (Alt+→)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    <input class="search" id="busca" type="search" name="busca" autocomplete="off" aria-label="Buscar nas anotações" placeholder="Buscar em todos os dias…">
    <button class="today-btn" id="hoje" type="button">Hoje</button>
  </nav>

  <header class="hero">
    <div class="big" id="dia" aria-hidden="true"></div>
    <div>
      <h1 id="titulo"></h1>
      <p><span id="mes"></span><span class="chip" id="semana"></span></p>
    </div>
  </header>

  <form class="capture" id="f" autocomplete="off">
    <div class="row">
      <input id="texto" name="texto" type="text" aria-label="Texto da anotação" placeholder="O que apareceu agora…" spellcheck="true"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sug">
      <label class="pend" title="A anotação volta nos dias seguintes até você concluir"><input type="checkbox" id="pend"><span>Pendente</span></label>
      <button class="save" type="submit">Anotar</button>
    </div>
    <ul id="sug" role="listbox" aria-label="Tags sugeridas" hidden></ul>
    <p class="hint"><kbd>Enter</kbd> salva · <kbd>Ctrl</kbd>+<kbd>K</kbd> busca · <kbd>Alt</kbd>+<kbd>←</kbd><kbd>→</kbd> dia · <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>N</kbd> anota de qualquer lugar</p>
  </form>

  <div id="lista"></div>

  <footer>
    <span class="path" id="path"></span>
    <a id="obs" href="#" target="_blank" rel="noreferrer" hidden>Abrir no Obsidian</a>
  </footer>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<div id="toast" role="status" hidden><span id="toast-msg"></span><button type="button" id="toast-undo">Desfazer</button></div>

<script src="/shared.js"></script>
<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const brDate=s=>{const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const post=(u,b)=>fetch(u,{method:'POST',body:JSON.stringify(b)});
const get=async u=>(await fetch(u)).json();
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);
  return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7)};
let cur=new Date(), searching=false;

// Texto com #tags clicáveis
function rich(el,text){
  text.split(/(#[\p{L}\p{N}_\/-]+)/u).forEach(part=>{
    if(/^#[\p{L}\p{N}_\/-]+$/u.test(part)){
      let h=0;for(const c of part.toLowerCase())h=(h*31+c.charCodeAt(0))%360;
      const b=document.createElement('button');b.type='button';b.className='tag';b.style.setProperty('--h',h);b.textContent=part;
      b.setAttribute('aria-label','Buscar '+part);
      b.onclick=()=>{$('busca').value=part;runSearch()};
      el.append(b);
    }else if(part)el.append(document.createTextNode(part));
  });
}
// Uma linha de anotação; `date` é o dia do arquivo (pode ser diferente do dia aberto)
const ICON={
  edit:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  del:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>'
};
function mkBtn(cls,label,icon,fn){
  const b=document.createElement('button');b.type='button';b.className=cls;b.title=label;b.setAttribute('aria-label',label);
  b.innerHTML=icon;b.onclick=fn;return b;
}
// Aviso com "Desfazer" depois de apagar
let toastTimer,undoFn=null;
function toast(msg,undo){
  $('toast-msg').textContent=msg;undoFn=undo;$('toast-undo').hidden=!undo;$('toast').hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').hidden=true;undoFn=null},8000);
}
$('toast-undo').onclick=async()=>{const f=undoFn;$('toast').hidden=true;undoFn=null;if(f){await f();load()}};
function startEdit(li,it,date,text){
  const txt=li.querySelector('.txt');
  const inp=document.createElement('input');inp.className='edit';inp.value=text;inp.setAttribute('aria-label','Editar anotação');
  txt.replaceWith(inp);li.querySelector('.acts')?.remove();inp.focus();inp.select();
  let done=false;
  const save=async()=>{
    if(done)return;done=true;
    const v=inp.value.trim();
    if(!v||v===text){load();return}
    const r=await post('/api/edit',{date,idx:it.idx,old:it.text,texto:v}).then(x=>x.json());
    $('status').textContent=r.ok?'Anotação atualizada':'O arquivo mudou; recarreguei o dia';
    loadTags();load();
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save()}else if(e.key==='Escape'){done=true;load()}});
  inp.addEventListener('blur',save);
}
// goFn: quando passado (resultados da busca), a data vira um botão que abre o dia
function item(it,date,showDate,actions,goFn){
  const li=document.createElement('li');
  const t=it.text.replace(/^- /,'');
  const task=t.match(/^\[( |x)\] (.*)/);
  const body=task?task[2]:t;
  const m=body.match(/^(\d{2}:\d{2}) (.*)/);
  const label=goFn?`${date.slice(8)}/${date.slice(5,7)}/${date.slice(2,4)}`:showDate?date.slice(8)+'/'+date.slice(5,7):(m?m[1]:'');
  const text=m?m[2]:body;
  const txt=document.createElement('span');txt.className='txt';rich(txt,text);
  const mkLabel=()=>{
    if(!label)return null;
    if(goFn){const b=document.createElement('button');b.type='button';b.className='go';b.textContent=label;
      b.setAttribute('aria-label','Abrir o dia '+brDate(date));b.onclick=goFn;return b}
    const tm=document.createElement('span');tm.className='time';tm.textContent=label;return tm;
  };
  const lbl=mkLabel();
  if(task){
    const lb=document.createElement('label');
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=task[1]==='x';cb.setAttribute('aria-label',text);
    cb.onchange=async()=>{await post('/api/toggle',{date,idx:it.idx});$('status').textContent=cb.checked?'Pendência concluída':'Pendência reaberta';load()};
    if(cb.checked)txt.className='txt done';
    lb.append(cb);if(lbl)lb.append(lbl);lb.append(txt);li.append(lb);
  }else{
    if(lbl)li.append(lbl);
    li.append(txt);
  }
  if(actions){
    const acts=document.createElement('span');acts.className='acts';
    acts.append(
      mkBtn('','Editar anotação',ICON.edit,()=>startEdit(li,it,date,text)),
      mkBtn('del','Apagar anotação',ICON.del,async()=>{
        const r=await post('/api/delete',{date,idx:it.idx,old:it.text}).then(x=>x.json());
        if(!r.ok){$('status').textContent='O arquivo mudou; recarreguei o dia';load();return}
        await load();
        toast('Anotação apagada.',()=>post('/api/restore',{date,idx:it.idx,line:it.text}));
      }));
    li.append(acts);
  }
  return li;
}
function section(titulo,cls,count){
  const sec=document.createElement('section');sec.className='sec '+(cls||'');
  const h=document.createElement('h2');h.textContent=titulo;
  if(count!=null){const n=document.createElement('span');n.className='n';n.textContent=count;h.append(n)}
  sec.append(h);return sec;
}

async function load(){
  if(searching)return;
  const ds=fmt(cur);
  const dtf=o=>new Intl.DateTimeFormat('pt-BR',o).format(cur);
  $('dia').textContent=cur.getDate();
  const ehHoje=fmt(cur)===fmt(new Date());$('dia').classList.toggle('today',ehHoje);$('hoje').disabled=ehHoje;
  $('titulo').textContent=dtf({weekday:'long'});
  $('mes').textContent=dtf({month:'long',year:'numeric'});
  $('semana').textContent='Semana '+isoWeek(cur);
  document.title=`Anotaí · ${dtf({day:'numeric',month:'short'})}`;
  let r,pend;
  try{[r,pend]=await Promise.all([get('/api/day?date='+ds),get('/api/pending?before='+ds)])}
  catch{$('status').textContent='Não consegui ler o dia. Reabra o app.';return}
  $('path').textContent=r.rel||'Este dia ainda não tem arquivo. Ele nasce na primeira anotação.';
  const obs=$('obs');
  if(r.rel&&r.obsidian){obs.hidden=false;obs.href=`obsidian://open?vault=${encodeURIComponent(r.vault)}&file=${encodeURIComponent(r.rel.replace(/\.md$/,''))}`}else obs.hidden=true;

  const lista=$('lista');lista.textContent='';
  if(pend.length){
    const sec=section('Pendentes de dias anteriores','late',pend.length);
    const ul=document.createElement('ul');
    pend.forEach(p=>ul.append(item(p,p.date,true)));
    sec.append(ul);lista.append(sec);
  }
  const items=Object.values(r.sections).flat();
  const abertas=items.filter(i=>/^- \[ \]/.test(i.text)).length;
  const sec=section('Anotações',null,abertas?`${abertas} pendente${abertas>1?'s':''}`:null);
  if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='Nada anotado neste dia ainda. Escreva acima e aperte Enter.';sec.append(p)}
  else{const ul=document.createElement('ul');items.forEach(it=>ul.append(item(it,ds,false,true)));sec.append(ul)}
  lista.append(sec);
}

// Busca em todos os dias
let timer;
async function runSearch(){
  clearTimeout(timer);
  const q=$('busca').value.trim();
  if(!q){searching=false;load();return}
  searching=true;
  const res=await get('/api/search?q='+encodeURIComponent(q));
  if($('busca').value.trim()!==q)return;
  const lista=$('lista');lista.textContent='';
  const h=document.createElement('p');h.className='res-h';
  h.textContent=res.length?`${res.length}${res.length>=200?'+':''} resultado${res.length>1?'s':''} para “${q}”`:`Nenhum resultado para “${q}”. Tente outra palavra ou uma #tag.`;
  lista.append(h);
  if(res.length){
    const ul=document.createElement('ul');
    res.forEach(r=>{
      const goFn=()=>{cur=parseDate(r.date);$('busca').value='';searching=false;load();$('texto').focus()};
      ul.append(item(r,r.date,false,false,goFn));
    });
    lista.append(ul);
  }
  $('status').textContent=`${res.length} resultados`;
}
$('busca').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(runSearch,200)});
$('busca').addEventListener('keydown',e=>{if(e.key==='Escape'){$('busca').value='';runSearch();$('texto').focus()}});

// Sugestão de tags ao digitar #
let tags=[],sugItems=[],sugIdx=0;
async function loadTags(){try{tags=await get('/api/tags')}catch{}}
function tagToken(){return tokenDe($('texto'))}
function hideSug(){const s=$('sug');s.hidden=true;s.textContent='';sugItems=[];$('texto').setAttribute('aria-expanded','false');$('texto').removeAttribute('aria-activedescendant')}
function paintSug(){
  const s=$('sug');s.textContent='';
  sugItems.forEach((t,i)=>{
    const li=document.createElement('li');li.id='sug-'+i;li.setAttribute('role','option');li.setAttribute('aria-selected',i===sugIdx);
    li.textContent=t;
    li.addEventListener('mousedown',e=>{e.preventDefault();acceptSug(i)});
    s.append(li);
  });
  $('texto').setAttribute('aria-activedescendant','sug-'+sugIdx);
}
function showSug(){
  const tk=tagToken();
  if(!tk){hideSug();return}
  sugItems=sugerirTags(tags.map(t=>t.tag),tk.q);
  if(!sugItems.length){hideSug();return}
  sugIdx=0;$('sug').hidden=false;$('texto').setAttribute('aria-expanded','true');paintSug();
}
function acceptSug(i){
  const inp=$('texto'),tk=tagToken();if(!tk)return;
  const after=inp.value.slice(inp.selectionStart),ins=sugItems[i]+' ';
  inp.value=inp.value.slice(0,tk.start)+ins+after.replace(/^ /,'');
  const pos=tk.start+ins.length;inp.setSelectionRange(pos,pos);hideSug();inp.focus();
}
$('texto').addEventListener('input',showSug);
$('texto').addEventListener('click',showSug);
$('texto').addEventListener('blur',hideSug);
$('texto').addEventListener('keydown',e=>{
  if($('sug').hidden)return;
  if(e.key==='ArrowDown'){e.preventDefault();sugIdx=(sugIdx+1)%sugItems.length;paintSug()}
  else if(e.key==='ArrowUp'){e.preventDefault();sugIdx=(sugIdx-1+sugItems.length)%sugItems.length;paintSug()}
  else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();acceptSug(sugIdx)}
  else if(e.key==='Escape'){e.preventDefault();hideSug()}
});

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const t=$('texto').value.trim();if(!t)return;
  await post('/api/add',{date:fmt(cur),texto:t,pendente:$('pend').checked});
  $('texto').value='';$('pend').checked=false;$('status').textContent='Anotação salva';
  if(searching){$('busca').value='';searching=false}
  hideSug();loadTags();
  await load();$('texto').focus();
});
$('prev').onclick=()=>{$('busca').value='';searching=false;cur.setDate(cur.getDate()-1);load()};
$('next').onclick=()=>{$('busca').value='';searching=false;cur.setDate(cur.getDate()+1);load()};
$('hoje').onclick=()=>{$('busca').value='';searching=false;cur=new Date();load();$('texto').focus()};
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('busca').focus();$('busca').select()}});
window.addEventListener('keydown',e=>{if(e.altKey&&!e.ctrlKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();(e.key==='ArrowLeft'?$('prev'):$('next')).click()}});
window.addEventListener('focus-capture',()=>{if(fmt(cur)!==fmt(new Date())){cur=new Date()} $('busca').value='';searching=false;load();$('texto').focus()});
window.addEventListener('agenda-refresh',()=>{load();loadTags()});
window.addEventListener('focus',()=>{load();loadTags()});
load();loadTags();
</script>
